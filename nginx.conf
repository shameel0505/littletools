server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs js;
        application/wasm wasm;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/wasm;

    # Explicit handling for .mjs modules
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Cache static assets (WASM, JS, CSS, images)
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA fallback for routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
